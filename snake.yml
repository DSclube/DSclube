name: Gerar cobrinha 🐍

on:
  # atualiza a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # permite rodar na mão pela aba Actions
  workflow_dispatch:
  # roda quando alguém atualiza a branch principal
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar o SVG da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          # ⚠️ troque pelo usuário (pessoa) cujas contribuições a cobrinha vai comer.
          # Organizações não têm gráfico de contribuições.
          github_user_name: SEU-USUARIO
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
