<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Clube D/S — programação na prática" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10231a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9be9a8"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" opacity="0.7"/>
    </pattern>
    <clipPath id="typed">
      <rect x="48" y="152" width="0" height="34">
        <animate attributeName="width" values="0;312;312;0" keyTimes="0;0.35;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- fundo -->
  <rect width="900" height="280" rx="14" fill="url(#bg)"/>
  <rect width="900" height="280" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="279" rx="14" fill="none" stroke="#30363d"/>

  <!-- símbolos de código flutuando -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="26" fill="#2ea043" opacity="0.55">
    <text x="690" y="70">{ }
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="780" y="105">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="700" y="150">=&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="810" y="170">01
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="760" y="40">;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- título -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
    <text x="46" y="108" font-size="58" font-weight="700" fill="url(#title)">Clube D<tspan fill="#e6edf3">/</tspan>S</text>
    <text x="48" y="140" font-size="20" fill="#8b949e">programação na prática</text>

    <!-- linha de terminal digitando -->
    <g clip-path="url(#typed)">
      <text x="48" y="175" font-size="20" fill="#7ee787">$ ./bem-vindo --estudantes</text>
    </g>
    <rect x="48" y="158" width="10" height="22" fill="#7ee787">
      <animate attributeName="x" values="48;360;360;48" keyTimes="0;0.35;0.92;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="48" y="208" font-size="14" fill="#6e7681">SENAI CIMATEC  ·  Desenvolvimento de Sistemas + Redes</text>
  </g>

  <!-- cobrinha: corpo (do rabo para a cabeça) -->
  <g>
    <circle r="4.2" fill="#2ea043"><animateMotion dur="10s" begin="-0.24s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="4.5" fill="#3fb950"><animateMotion dur="10s" begin="-0.35s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="4.8" fill="#2ea043"><animateMotion dur="10s" begin="-0.46s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="5.1" fill="#3fb950"><animateMotion dur="10s" begin="-0.57s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="5.4" fill="#2ea043"><animateMotion dur="10s" begin="-0.68s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="5.7" fill="#3fb950"><animateMotion dur="10s" begin="-0.79s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="6" fill="#2ea043"><animateMotion dur="10s" begin="-0.9s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="6.3" fill="#3fb950"><animateMotion dur="10s" begin="-1.01s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="6.6" fill="#2ea043"><animateMotion dur="10s" begin="-1.12s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="6.9" fill="#3fb950"><animateMotion dur="10s" begin="-1.23s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="7.2" fill="#2ea043"><animateMotion dur="10s" begin="-1.34s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="7.5" fill="#3fb950"><animateMotion dur="10s" begin="-1.45s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="7.8" fill="#2ea043"><animateMotion dur="10s" begin="-1.56s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="8.1" fill="#3fb950"><animateMotion dur="10s" begin="-1.67s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="8.4" fill="#2ea043"><animateMotion dur="10s" begin="-1.78s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>
    <circle r="8.7" fill="#3fb950"><animateMotion dur="10s" begin="-1.89s" repeatCount="indefinite" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/></circle>

    <!-- cabeça -->
    <g>
      <ellipse cx="3" cy="0" rx="12" ry="9.5" fill="#56d364"/>
      <circle cx="6" cy="-4" r="2.6" fill="#fff"/>
      <circle cx="6" cy="4" r="2.6" fill="#fff"/>
      <circle cx="7" cy="-4" r="1.2" fill="#0d1117"/>
      <circle cx="7" cy="4" r="1.2" fill="#0d1117"/>
      <path d="M 14 0 L 21 0 M 21 0 L 25 -3 M 21 0 L 25 3" stroke="#f85149" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <animateMotion dur="10s" begin="-2s" repeatCount="indefinite" rotate="auto" path="M -40 245 C 60 215, 140 275, 230 245 S 400 215, 490 245 S 660 275, 750 245 S 920 215, 1000 245"/>
    </g>
  </g>
</svg>
