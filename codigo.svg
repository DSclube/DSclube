<text x="76" y="481" xml:space="preserve"><tspan fill="#f1f5f9">Bem-vindo(a), você! A gente guardou um lugar pra você.</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.380;0.392;0.95;1" dur="16s" repeatCount="indefinite"/></text>
