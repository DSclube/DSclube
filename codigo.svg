<text x="76" y="94" xml:space="preserve"><tspan fill="#5f77a8">// clube-ds.js</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.020;0.032;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="117" xml:space="preserve"><tspan fill="#ff6a00">const </tspan><tspan fill="#f1f5f9">clubeDS</tspan><tspan fill="#8aa0cf"> = {</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.042;0.054;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="140" xml:space="preserve"><tspan fill="#f1f5f9">  nome</tspan><tspan fill="#8aa0cf">: </tspan><tspan fill="#4d9bff">"Clube D/S"</tspan><tspan fill="#8aa0cf">,</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.064;0.076;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="163" xml:space="preserve"><tspan fill="#f1f5f9">  escola</tspan><tspan fill="#8aa0cf">: </tspan><tspan fill="#4d9bff">"SENAI CIMATEC"</tspan><tspan fill="#8aa0cf">,</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.086;0.098;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="186" xml:space="preserve"><tspan fill="#f1f5f9">  cursos</tspan><tspan fill="#8aa0cf">: [</tspan><tspan fill="#4d9bff">"Desenvolvimento de Sistemas"</tspan><tspan fill="#8aa0cf">, </tspan><tspan fill="#4d9bff">"Redes"</tspan><tspan fill="#8aa0cf">],</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.108;0.120;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="209" xml:space="preserve"><tspan fill="#f1f5f9">  lema</tspan><tspan fill="#8aa0cf">: </tspan><tspan fill="#4d9bff">"Programação na prática"</tspan><tspan fill="#8aa0cf">,</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.130;0.142;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="232" xml:space="preserve"><tspan fill="#8aa0cf">};</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.152;0.164;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="278" xml:space="preserve"><tspan fill="#ff6a00">export function </tspan><tspan fill="#29c5ff">entrar</tspan><tspan fill="#8aa0cf">({ </tspan><tspan fill="#f1f5f9">nome</tspan><tspan fill="#8aa0cf">, </tspan><tspan fill="#f1f5f9">curso</tspan><tspan fill="#8aa0cf"> }) {</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.196;0.208;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="301" xml:space="preserve"><tspan fill="#f1f5f9">  </tspan><tspan fill="#ff6a00">if </tspan><tspan fill="#8aa0cf">(!</tspan><tspan fill="#f1f5f9">clubeDS</tspan><tspan fill="#8aa0cf">.cursos.</tspan><tspan fill="#29c5ff">includes</tspan><tspan fill="#8aa0cf">(</tspan><tspan fill="#f1f5f9">curso</tspan><tspan fill="#8aa0cf">)) {</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.218;0.230;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="324" xml:space="preserve"><tspan fill="#f1f5f9">    </tspan><tspan fill="#ff6a00">return </tspan><tspan fill="#4d9bff">`</tspan><tspan fill="#29c5ff">${</tspan><tspan fill="#f1f5f9">nome</tspan><tspan fill="#29c5ff">}</tspan><tspan fill="#4d9bff">, o clube é pra quem cursa </tspan><tspan fill="#29c5ff">${</tspan><tspan fill="#f1f5f9">clubeDS</tspan><tspan fill="#8aa0cf">.cursos.</tspan><tspan fill="#29c5ff">join</tspan><tspan fill="#8aa0cf">(</tspan><tspan fill="#4d9bff">" ou "</tspan><tspan fill="#8aa0cf">)</tspan><tspan fill="#29c5ff">}</tspan><tspan fill="#4d9bff">.`</tspan><tspan fill="#8aa0cf">;</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.240;0.252;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="347" xml:space="preserve"><tspan fill="#8aa0cf">  }</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.262;0.274;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="370" xml:space="preserve"><tspan fill="#f1f5f9">  </tspan><tspan fill="#ff6a00">return </tspan><tspan fill="#4d9bff">`Bem-vindo(a), </tspan><tspan fill="#29c5ff">${</tspan><tspan fill="#f1f5f9">nome</tspan><tspan fill="#29c5ff">}</tspan><tspan fill="#4d9bff">! A gente guardou um lugar pra você.`</tspan><tspan fill="#8aa0cf">;</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.284;0.296;0.95;1" dur="16s" repeatCount="indefinite"/></text>
<text x="76" y="393" xml:space="preserve"><tspan fill="#8aa0cf">}</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.306;0.318;0.95;1" dur="16s" repeatCount="indefinite"/></text>
